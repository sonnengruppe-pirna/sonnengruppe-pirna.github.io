<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ Gruppenkasse Sonnengruppe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <div class="meadow">
        <span class="flower">🌼</span>
        <span class="flower">🌷</span>
        <span class="flower">🌸</span>
        <span class="flower">🌻</span>
        <span class="flower">🌼</span>
        <span class="flower">🌷</span>
        <span class="flower">🌺</span>
        <span class="flower">🌸</span>
        <span class="flower">🌻</span>
    </div>

    <main class="wrap">

        <header>

            <div class="sunflower">☀️</div>

            <h1>Gruppenkasse Sonnengruppe</h1>

            <p class="subtitle">
                Übersicht über Einnahmen und Ausgaben
            </p>

        </header>

        <section class="card balance">

            <div class="label">
                Aktueller Kassenstand
            </div>

            <div id="balance" class="amount">
                0,00 €
            </div>

            <div class="updated">
                automatisch berechnet
            </div>

        </section>

        <section class="card section">

            <div class="section-head">

                <h2>Buchungen</h2>

                <span class="hint">
                    Neueste zuerst
                </span>

            </div>

            <div id="transactions" class="transactions">

                <div class="transaction in">
                    <div class="icon">↓</div>

                    <div>
                        <div class="desc">
                            Kinderbeitrag November
                        </div>

                        <div class="date">
                            01.11.2026
                        </div>
                    </div>

                    <div class="value">
                        +120,00 €
                    </div>
                </div>

                <div class="transaction out">
                    <div class="icon">↑</div>

                    <div>
                        <div class="desc">
                            Bastelmaterial
                        </div>

                        <div class="date">
                            03.11.2026
                        </div>
                    </div>

                    <div class="value">
                        -34,50 €
                    </div>
                </div>

            </div>

        </section>

        <footer>
            ☀️ Sonnengruppe Pirna
        </footer>

    </main>

</body>
</html>
